<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000080" />
  <rect x="16" y="16" width="480" height="480" fill="#c0c0c0" stroke="#ffffff" stroke-width="8" />
  <!-- Bevel edges -->
  <path d="M16 16 L496 16 L464 48 L48 48 L48 464 L16 496 Z" fill="#ffffff" />
  <path d="M496 16 L496 496 L16 496 L48 464 L464 464 L464 48 Z" fill="#808080" />
  
  <!-- Titlebar in icon -->
  <rect x="36" y="36" width="440" height="56" fill="#000080" />
  <text x="56" y="74" fill="#ffff00" font-family="Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="2">ULTRA RADIO 95</text>
  <rect x="430" y="44" width="36" height="36" fill="#c0c0c0" stroke="#000000" stroke-width="2" />
  <text x="442" y="68" fill="#000000" font-family="Arial, sans-serif" font-weight="bold" font-size="22">✕</text>

  <!-- LCD Screen Area -->
  <rect x="36" y="108" width="440" height="230" fill="#001400" stroke="#808080" stroke-width="4" />
  <rect x="44" y="116" width="424" height="214" fill="#000a00" />
  
  <!-- Radio Antenna -->
  <line x1="120" y1="108" x2="60" y2="40" stroke="#333333" stroke-width="8" stroke-linecap="round" />
  <circle cx="56" cy="36" r="10" fill="#ff0000" />

  <!-- LCD Screen Text -->
  <text x="64" y="152" fill="#00ff44" font-family="Courier New, monospace" font-weight="bold" font-size="30">FM 108.5 MHz</text>
  <text x="64" y="195" fill="#ffff00" font-family="Tahoma, Arial, sans-serif" font-weight="900" font-size="34">الترادیو</text>
  <text x="64" y="235" fill="#00ffaa" font-family="Courier New, monospace" font-size="20">STEREO HIGH-FIDELITY</text>
  
  <!-- VU Equalizer Bars in LCD -->
  <rect x="64" y="260" width="18" height="50" fill="#00ff00" />
  <rect x="90" y="275" width="18" height="35" fill="#00ff00" />
  <rect x="116" y="250" width="18" height="60" fill="#00ff00" />
  <rect x="142" y="240" width="18" height="70" fill="#ffff00" />
  <rect x="168" y="265" width="18" height="45" fill="#00ff00" />
  <rect x="194" y="230" width="18" height="80" fill="#ff0000" />
  <rect x="220" y="255" width="18" height="55" fill="#ffff00" />
  <rect x="246" y="270" width="18" height="40" fill="#00ff00" />
  <rect x="272" y="245" width="18" height="65" fill="#00ff00" />
  <rect x="298" y="235" width="18" height="75" fill="#ffff00" />
  <rect x="324" y="260" width="18" height="50" fill="#00ff00" />
  <rect x="350" y="250" width="18" height="60" fill="#00ff00" />
  <rect x="376" y="225" width="18" height="85" fill="#ff0000" />
  <rect x="402" y="270" width="18" height="40" fill="#00ff00" />
  <rect x="428" y="280" width="18" height="30" fill="#00ff00" />

  <!-- Lower Deck / Win95 Buttons -->
  <rect x="36" y="356" width="120" height="96" fill="#c0c0c0" stroke="#808080" stroke-width="4" />
  <polygon points="76,380 76,430 120,405" fill="#000080" />
  
  <!-- Cassette Tape Window -->
  <rect x="174" y="356" width="302" height="96" fill="#1a1a1a" stroke="#808080" stroke-width="4" />
  <circle cx="235" cy="404" r="24" fill="#ffffff" stroke="#000000" stroke-width="4" />
  <circle cx="235" cy="404" r="8" fill="#000000" />
  <circle cx="415" cy="404" r="24" fill="#ffffff" stroke="#000000" stroke-width="4" />
  <circle cx="415" cy="404" r="8" fill="#000000" />
  <rect x="270" y="388" width="110" height="32" fill="#ffffcc" stroke="#000000" stroke-width="2" />
  <text x="280" y="410" fill="#cc0000" font-family="Arial, sans-serif" font-weight="bold" font-size="16">ULTRA RADIO</text>
</svg>

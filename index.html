<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ultradio | استریم زنده رادیو نوستالژیک</title>
    <meta name="theme-color" content="#000080">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --win-bg: #C0C0C0;
            --win-dark-blue: #000080;
            --win-light-blue: #1084D0;
            --win-lcd-bg: #0A120A;
            --win-lcd-green: #39FF14;
            --win-shadow-dark: #404040;
            --win-shadow-light: #FFFFFF;
            --win-card-bg: #D4D0C8;
            --accent-green: #00E676;
            --accent-yellow: #FFFF00;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            background-color: #008080; /* Windows 95 Desktop Teal */
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        /* Minimalist Mobile Window Shell */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            background-color: var(--win-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 35px rgba(0,0,0,0.6);
            border-left: 2px solid var(--win-shadow-light);
            border-right: 2px solid #000;
            overflow: hidden;
        }

        /* Win95 Header Bar */
        .win-titlebar {
            background: linear-gradient(90deg, var(--win-dark-blue), var(--win-light-blue));
            color: #FFFFFF;
            padding: 7px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
            border-bottom: 2px solid #000;
            z-index: 20;
        }

        .win-controls {
            display: flex;
            gap: 3px;
        }

        .win-btn {
            width: 16px;
            height: 14px;
            background: var(--win-bg);
            border-top: 1px solid #FFF;
            border-left: 1px solid #FFF;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Scrollable Main View */
        .main-scroll-view {
            flex: 1;
            overflow-y: auto;
            padding: 10px 10px 145px 10px; /* Leave space for bottom player */
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        /* TOP SECTION: Featured Dynamic Album Cover & Live Track Metadata */
        .now-playing-hero-card {
            background: #111822;
            border: 2px inset var(--win-shadow-dark);
            border-radius: 4px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.7);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        /* Vinyl / Cover Art Box */
        .hero-cover-box {
            width: 90px;
            height: 90px;
            background: #000;
            border: 2px solid #FFF;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .hero-cover-img.rotating {
            animation: spin 18s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .hero-meta-box {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .hero-live-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            font-weight: bold;
            font-family: monospace;
        }

        .badge-live-tag {
            background: #FF3333;
            color: #FFF;
            padding: 1px 6px;
            border-radius: 2px;
            font-size: 9px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pulse-dot {
            width: 5px;
            height: 5px;
            background: #FFF;
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .hero-station-title {
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hero-song-name {
            color: var(--win-lcd-green);
            font-size: 12px;
            font-family: monospace;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.4);
        }

        .hero-artist-name {
            color: #A0AEC0;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 16-Band Micro Spectrum */
        .hero-spectrum {
            display: flex;
            align-items: flex-end;
            height: 18px;
            gap: 2px;
            margin-top: 4px;
        }

        .hero-bar {
            flex: 1;
            background: linear-gradient(to top, var(--win-lcd-green) 50%, #FF0 85%, #F00 100%);
            height: 15%;
            border-radius: 1px 1px 0 0;
            transition: height 0.1s ease;
        }

        /* Horizontal Genre Filter Bar (Spotify Chips Style) */
        .genre-chips-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            flex-shrink: 0;
            padding-bottom: 2px;
        }
        .genre-chips-scroll::-webkit-scrollbar { display: none; }

        .genre-chip {
            background: var(--win-bg);
            border-top: 1.5px solid #FFF;
            border-left: 1.5px solid #FFF;
            border-right: 1.5px solid var(--win-shadow-dark);
            border-bottom: 1.5px solid var(--win-shadow-dark);
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            color: #000;
            white-space: nowrap;
            cursor: pointer;
            border-radius: 2px;
        }

        .genre-chip.active {
            background: var(--win-dark-blue);
            color: #FFF;
            border-top: 1.5px solid #000;
            border-left: 1.5px solid #000;
            border-right: 1.5px solid #FFF;
            border-bottom: 1.5px solid #FFF;
        }

        /* SECTION: Stations Channel List */
        .section-heading {
            font-size: 12px;
            font-weight: 800;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .channels-list-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .channel-row-card {
            background: var(--win-card-bg);
            border-top: 1.5px solid #FFF;
            border-left: 1.5px solid #FFF;
            border-right: 1.5px solid var(--win-shadow-dark);
            border-bottom: 1.5px solid var(--win-shadow-dark);
            border-radius: 3px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .channel-row-card:active {
            background: #B8B4AC;
        }

        .channel-row-card.active {
            background: var(--win-dark-blue) !important;
            border-top: 1.5px solid #000 !important;
            border-left: 1.5px solid #000 !important;
            border-right: 1.5px solid #FFF !important;
            border-bottom: 1.5px solid #FFF !important;
        }

        .channel-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .channel-avatar {
            width: 38px;
            height: 38px;
            background: #000;
            border: 1px inset #808080;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--win-lcd-green);
            font-size: 16px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .channel-row-card.active .channel-avatar {
            color: var(--accent-yellow);
            border-color: #FFF;
        }

        .channel-info-text {
            flex: 1;
            min-width: 0;
        }

        .channel-name-fa {
            font-size: 12.5px;
            font-weight: 800;
            color: #000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .channel-row-card.active .channel-name-fa {
            color: #FFF;
        }

        .channel-subtitle {
            font-size: 10px;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .channel-row-card.active .channel-subtitle {
            color: #D4D0C8;
        }

        .channel-bitrate-tag {
            font-size: 9px;
            font-weight: bold;
            font-family: monospace;
            padding: 2px 6px;
            background: var(--win-shadow-dark);
            color: #FFF;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .channel-row-card.active .channel-bitrate-tag {
            background: var(--accent-yellow);
            color: #000;
        }

        /* STICKY BOTTOM PLAYBACK BAR (Always visible in mobile Chrome) */
        .bottom-sticky-player {
            position: absolute;
            bottom: calc(26px + var(--safe-bottom));
            left: 0;
            right: 0;
            background: #141A22;
            border-top: 2px solid var(--win-light-blue);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            z-index: 40;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.5);
        }

        .mini-meta-click {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .mini-player-cover {
            width: 36px;
            height: 36px;
            background: var(--win-dark-blue);
            border: 1px solid #FFF;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFF;
            font-size: 15px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .mini-player-texts {
            flex: 1;
            min-width: 0;
        }

        .mini-station-name {
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-live-status {
            color: var(--win-lcd-green);
            font-size: 9.5px;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-controls-cluster {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .retro-player-btn {
            background: var(--win-bg);
            border-top: 2px solid #FFF;
            border-left: 2px solid #FFF;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .retro-player-btn.play-btn-green {
            background: var(--accent-green);
            color: #000;
            padding: 6px 14px;
            font-size: 14px;
        }

        .retro-player-btn:active {
            border-top: 2px solid #000;
            border-left: 2px solid #000;
            border-right: 2px solid #FFF;
            border-bottom: 2px solid #FFF;
        }

        /* Fixed Taskbar */
        .fixed-win-taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(26px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: var(--win-bg);
            border-top: 1.5px solid #FFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 8px;
            padding-right: 8px;
            z-index: 40;
        }

        .start-btn {
            background: var(--win-bg);
            border-top: 1.5px solid #FFF;
            border-left: 1.5px solid #FFF;
            border-right: 1.5px solid #404040;
            border-bottom: 1.5px solid #404040;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #000;
            cursor: pointer;
        }

        .signature-pill {
            border: 1px inset #808080;
            padding: 1px 6px;
            font-family: monospace;
            font-size: 9.5px;
            font-weight: bold;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Windows 95 Top Window Header -->
        <div class="win-titlebar">
            <div style="display: flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-radio"></i>
                <span>Ultradio 95 — استریم زنده رادیو نوستالژیک</span>
            </div>
            <div class="win-controls">
                <div class="win-btn">_</div>
                <div class="win-btn">□</div>
                <div class="win-btn">✕</div>
            </div>
        </div>

        <!-- Scrollable Feed: Hero Cover + Category Filters + Stations -->
        <div class="main-scroll-view" id="feed-scroll">
            
            <!-- TOP CARD: Now Playing Cover Art + Live Song Info -->
            <div class="now-playing-hero-card">
                <div class="hero-cover-box">
                    <img id="hero-cover-image" class="hero-cover-img" src="icon.svg" alt="Album Cover">
                </div>
                <div class="hero-meta-box">
                    <div class="hero-live-badge">
                        <span class="badge-live-tag" id="live-indicator"><span class="pulse-dot"></span> LIVE</span>
                        <span style="color: var(--win-lcd-green);" id="hero-bitrate-tag">320 KBPS</span>
                    </div>
                    <div class="hero-station-title" id="hero-station-name">پاپ خارجی (Pop Hits)</div>
                    <div class="hero-song-name" id="hero-track-title">♫ در حال لود اطلاعات آهنگ...</div>
                    <div class="hero-artist-name" id="hero-artist-title">Ultradio Streaming Network</div>
                    <!-- Animated Spectrum -->
                    <div class="hero-spectrum" id="spectrum-bars"></div>
                </div>
            </div>

            <!-- Horizontal Category Chips (Spotify Style) -->
            <div class="genre-chips-scroll">
                <button class="genre-chip active" onclick="filterGenre('all', this)">همه (۱۲)</button>
                <button class="genre-chip" onclick="filterGenre('persian', this)">🇮🇷 فارسی سنتی</button>
                <button class="genre-chip" onclick="filterGenre('rap', this)">🎤 رپ فارسی</button>
                <button class="genre-chip" onclick="filterGenre('pop', this)">🎵 پاپ جهانی</button>
                <button class="genre-chip" onclick="filterGenre('phonk', this)">⚡ دریفت فانک</button>
                <button class="genre-chip" onclick="filterGenre('lofi', this)">☕ لوفای و تمرکز</button>
                <button class="genre-chip" onclick="filterGenre('rock', this)">🎸 راک و متال</button>
            </div>

            <!-- Channel List Heading -->
            <div class="section-heading">
                <span>📻 ایستگاه‌های رادیویی:</span>
                <span style="font-size: 10px; color: #555;" id="channel-count-tag">۱۲ کانال آنلاین</span>
            </div>

            <!-- Channels Feed -->
            <div class="channels-list-box" id="channels-container"></div>
        </div>

        <!-- STICKY BOTTOM PLAYBACK BAR (Spotify Mobile Style) -->
        <div class="bottom-sticky-player">
            <div class="mini-meta-click" onclick="togglePlayback()">
                <div class="mini-player-cover">
                    <img id="mini-cover-img" src="icon.svg" style="width:100%;height:100%;object-fit:cover;">
                </div>
                <div class="mini-player-texts">
                    <div class="mini-station-name" id="mini-st-name">پاپ خارجی (Pop Hits)</div>
                    <div class="mini-live-status" id="mini-live-st">آماده پخش • 320 kbps</div>
                </div>
            </div>
            <div class="mini-controls-cluster">
                <button class="retro-player-btn" onclick="prevStation()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="retro-player-btn play-btn-green" id="sticky-play-btn" onclick="togglePlayback()"><i class="fa-solid fa-play"></i></button>
                <button class="retro-player-btn" onclick="nextStation()"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>

        <!-- Fixed Win95 Bottom Taskbar -->
        <div class="fixed-win-taskbar">
            <div class="start-btn" onclick="togglePlayback()">
                <i class="fa-brands fa-windows" style="color: var(--win-dark-blue);"></i>
                <span>Start</span>
            </div>
            <div class="signature-pill">
                Crafted with passion by Hellboy Coder ⚡
            </div>
        </div>
    </div>

            { id: "rock", cat: "rock", icon: "fa-guitar", nameFa: "راک و متال", nameEn: "Classic & Hard Rock", url: "https://radio.9craft.ir:7443/rock", bitrate: "320 kbps", desc: "سولوهای افسانه‌ای گیتار و هارد راک", defaultCover: "https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=300&auto=format&fit=crop&q=60" },
            { id: "relax", cat: "lofi", icon: "fa-moon", nameFa: "آرامش بخش", nameEn: "Relax & Ambient", url: "https://radio.9craft.ir:7443/relax", bitrate: "256 kbps", desc: "موسیقی امبینت، مدیتیشن و امواج التیام‌بخش", defaultCover: "https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?w=300&auto=format&fit=crop&q=60" },
            { id: "soul", cat: "persian", icon: "fa-heart", nameFa: "سول و بلوز", nameEn: "Soul & Neo-Soul", url: "https://radio.9craft.ir:7443/soul", bitrate: "256 kbps", desc: "نوای احساسی سول و آر اند بی ریشه‌دار", defaultCover: "https://images.unsplash.com/photo-1520523839898-507128003666?w=300&auto=format&fit=crop&q=60" },
            { id: "ost", cat: "pop", icon: "fa-film", nameFa: "موسیقی متن (OST)", nameEn: "Soundtracks & OST", url: "https://radio.9craft.ir:7443/ost", bitrate: "320 kbps", desc: "ماندگارترین موسیقی متن فیلم و انیمه", defaultCover: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300&auto=format&fit=crop&q=60" }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let audioPlayer = new Audio();
        let spectrumInterval = null;
        let currentFilter = 'all';

        // Render Spectrum Bars
        const spectrumContainer = document.getElementById('spectrum-bars');
        for(let i=0; i<16; i++) {
            const bar = document.createElement('div');
            bar.className = 'hero-bar';
            spectrumContainer.appendChild(bar);
        }

        function renderChannelList() {
            const container = document.getElementById('channels-container');
            container.innerHTML = '';

            let count = 0;
            STATIONS.forEach((station, index) => {
                if (currentFilter !== 'all' && station.cat !== currentFilter) return;
                count++;

                const isCurrent = (index === currentIndex);
                const card = document.createElement('div');
                card.className = `channel-row-card ${isCurrent ? 'active' : ''}`;
                card.id = `channel-row-${index}`;
                card.onclick = () => selectStation(index);

                card.innerHTML = `
                    <div class="channel-left">
                        <div class="channel-avatar">
                            <i class="fa-solid ${station.icon}"></i>
                        </div>
                        <div class="channel-info-text">
                            <div class="channel-name-fa">
                                <span>${station.nameFa}</span>
                                <span style="font-size: 10px; opacity: 0.8;">(${station.nameEn})</span>
                            </div>
                            <div class="channel-subtitle">${station.desc}</div>
                        </div>
                    </div>
                    <span class="channel-bitrate-tag">${station.bitrate}</span>
                `;
                container.appendChild(card);
            });

            document.getElementById('channel-count-tag').textContent = `${count} کانال`;
        }

        function filterGenre(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            renderChannelList();
        }

        function animateBars() {
            const bars = document.querySelectorAll('.hero-bar');
            bars.forEach(b => {
                b.style.height = isPlaying ? (Math.floor(Math.random() * 85) + 15) + '%' : '15%';
            });
        }

        // Live Metadata Fetching from 9craft API
        async function fetchSongMetadata() {
            try {
                const res = await fetch('https://radio.9craft.ir/v1/api/genre/all');
                if (res.ok) {
                    const json = await res.json();
                    if (json && Array.isArray(json.data)) {
                        const currentStation = STATIONS[currentIndex];
                        const meta = json.data.find(d => d.genre && d.genre.toLowerCase() === currentStation.id.toLowerCase());
                        if (meta) {
                            if (meta.title) document.getElementById('hero-track-title').textContent = `♫ ${meta.title}`;
                            if (meta.artist) document.getElementById('hero-artist-title').textContent = meta.artist;
                            if (meta.cover_url) {
                                document.getElementById('hero-cover-image').src = meta.cover_url;
                                document.getElementById('mini-cover-img').src = meta.cover_url;
                            }
                        }
                    }
                }
            } catch(e) {
                // Fallback gracefully
            }
        }

        function selectStation(index) {
            currentIndex = index;
            const station = STATIONS[index];

            // Update Hero Meta
            document.getElementById('hero-station-name').textContent = `${station.nameFa} (${station.nameEn})`;
            document.getElementById('hero-bitrate-tag').textContent = station.bitrate;
            document.getElementById('hero-cover-image').src = station.defaultCover;
            document.getElementById('mini-cover-img').src = station.defaultCover;
            document.getElementById('hero-track-title').textContent = `♫ ${station.nameFa}`;
            document.getElementById('hero-artist-title').textContent = station.desc;

            // Update Sticky Player
            document.getElementById('mini-st-name').textContent = `${station.nameFa} (${station.nameEn})`;
            document.getElementById('mini-live-st').textContent = `در حال اتصال • ${station.bitrate}`;

            renderChannelList();
            startPlayback();
            fetchSongMetadata();
        }

        function startPlayback() {
            const station = STATIONS[currentIndex];
            audioPlayer.src = station.url;

            const coverImg = document.getElementById('hero-cover-image');

            audioPlayer.play().then(() => {
                isPlaying = true;
                coverImg.classList.add('rotating');
                document.getElementById('sticky-play-btn').innerHTML = '<i class="fa-solid fa-pause"></i>';
                document.getElementById('mini-live-st').textContent = `● پخش زنده • ${station.bitrate}`;

                if (!spectrumInterval) spectrumInterval = setInterval(animateBars, 100);

                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: station.nameFa,
                        artist: `الترادیو — ${station.nameEn}`,
                        album: "Ultradio Windows 95 Live",
                        artwork: [{ src: station.defaultCover, sizes: "300x300", type: "image/jpeg" }]
                    });

                    navigator.mediaSession.setActionHandler('play', startPlayback);
                    navigator.mediaSession.setActionHandler('pause', togglePlayback);
                    navigator.mediaSession.setActionHandler('previoustrack', prevStation);
                    navigator.mediaSession.setActionHandler('nexttrack', nextStation);
                }
            }).catch(err => {
                console.warn('Playback issue:', err);
                document.getElementById('mini-live-st').textContent = '✕ تلاش برای اتصال مجدد...';
            });
        }

        function togglePlayback() {
            const coverImg = document.getElementById('hero-cover-image');
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                coverImg.classList.remove('rotating');
                document.getElementById('sticky-play-btn').innerHTML = '<i class="fa-solid fa-play"></i>';
                document.getElementById('mini-live-st').textContent = 'متوقف شده';
                clearInterval(spectrumInterval);
                spectrumInterval = null;
                animateBars();
            } else {
                startPlayback();
            }
        }

        function nextStation() {
            selectStation((currentIndex + 1) % STATIONS.length);
        }

        function prevStation() {
            selectStation((currentIndex - 1 + STATIONS.length) % STATIONS.length);
        }

        // Initialize view & periodic live metadata update
        renderChannelList();
        selectStation(0);
        setInterval(fetchSongMetadata, 15000);
    </script>
</body>
</html>

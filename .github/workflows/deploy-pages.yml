name: Deploy Ultradio Web & PWA to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare production build
        run: |
          mkdir -p dist
          cp standalone.html dist/index.html
          cp icon.svg dist/icon.svg || true
          cp -r public/* dist/ 2>/dev/null || true

      - name: Deploy to GitHub Pages Branch (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
